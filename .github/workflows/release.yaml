name: Release

# Runs on every push to main (plus manual dispatch). Release-only: dist/ is
# never committed to the repo. Two things happen in sequence, in one job:
#
#   1. Run release-it (single repo-wide version - see .release-it.json -
#      matching the convention used across nsheaps repos: one CHANGELOG.md,
#      one `vX.Y.Z` git tag, one GitHub Release per repo, driven by
#      conventional commits). If there are no releasable commits (no `feat`/
#      `fix`/breaking-change commits since the last tag), release-it no-ops
#      and step 2 is skipped for this run, same as documented for
#      nsheaps/github2's equivalent pipeline.
#
#   2. If a new release WAS cut, build every package (transiently - nothing
#      from this build is ever committed or pushed) and upload each "public"
#      package's compiled dist/*.user.js as an asset on that release. This is
#      the actual artifact GitHub's stable
#      `.../releases/latest/download/<name>` URL redirects to (verified live
#      against an existing nsheaps release before wiring this up - see PR
#      description). A package opts in via `"greasyforkPublish": true` in
#      its own package.json; internal-only packages (e.g.
#      github-actions-grafana-jump, whose own header says it's intentionally
#      not meant for public distribution) are skipped by simply not setting
#      that field.
#
# Building AFTER release-it (rather than before, so nothing needs to sit
# around unused when there's no release) means the checked-out tree already
# reflects whatever version bump/changelog release-it just committed, so the
# resulting dist output corresponds to exactly what got tagged.
#
# main is protected by an active `require-pr` ruleset. release-it's own
# version-bump commit+tag still needs to push straight to main as the
# automation bot (checkout-as-app, same as apply-repo-settings.yaml uses) -
# that bypass-coverage question is tracked separately at the org level
# (task #103), not re-litigated here. This workflow itself no longer commits
# anything of its own (dist is build-only, never staged/pushed), so it only
# inherits release-it's own push requirement, not an additional one.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout as automation bot
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"

      - name: Set up corepack
        run: corepack enable && corepack install

      - name: Install dependencies
        run: yarn install --immutable

      - name: Determine pre-release tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        run: yarn run release:ci

      - name: Determine post-release tag
        id: after
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Build all packages
        if: steps.before.outputs.tag != steps.after.outputs.tag
        run: yarn run build

      - name: Upload public packages' compiled userscripts to the new release
        if: steps.before.outputs.tag != steps.after.outputs.tag
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.after.outputs.tag }}"
          UPLOAD_DIR="$(mktemp -d)"

          for pkg_dir in packages/*/; do
            pkg_json="${pkg_dir}package.json"
            [ -f "$pkg_json" ] || continue
            is_public=$(node -pe "require('./${pkg_json}').greasyforkPublish === true" 2>/dev/null || echo false)
            [ "$is_public" = "true" ] || continue

            pkg_name=$(basename "$pkg_dir")
            # Every opted-in package's own build script emits
            # dist/script.user.js (see packages/*/tsconfig.json's comments on
            # why); rename to <package-dir-name>.user.js on the way to the
            # release so multiple packages' assets can coexist on the same
            # release, and so the name matches the fixed
            # `.../releases/latest/download/<name>.user.js` URL baked into
            # each package's own @downloadURL/@updateURL. This dist/ output
            # is transient - built fresh in this job, never committed.
            src="${pkg_dir}dist/script.user.js"
            if [ ! -f "$src" ]; then
              echo "::error::greasyforkPublish is true for $pkg_name but $src was not found after build"
              exit 1
            fi

            dest="${UPLOAD_DIR}/${pkg_name}.user.js"
            cp "$src" "$dest"
            echo "Uploading $dest on $TAG"
            gh release upload "$TAG" "$dest" --repo "${{ github.repository }}" --clobber
          done
