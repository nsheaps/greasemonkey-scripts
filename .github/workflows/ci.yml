name: CI

# Correctness gate for every push and PR: every package must actually build
# (tsc --build + each package's own postbuild step) and pass its own `test`
# target. Regenerating dist here isn't just "best effort" - a build/typecheck
# or test failure fails this required check. Actually publishing the
# resulting dist/*.user.js (repo commit + versioned release asset) is a
# separate concern handled by release.yaml on pushes to main.
#
# Every package defines a `test` script so `nx run-many --target=test --all`
# has something to run for all of them. Scaffold/template packages and the
# two userscripts that don't have real coverage yet get a no-op passing
# `test` (replace it with real tests as coverage is added); the placeholder
# no longer fails the gate. github-actions-grafana-jump has real tests
# (`node --test test/*.test.js`).

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise.toml pins node and yarn (in lockstep with .nvmrc and
      # package.json's packageManager), so CI and local checkouts run the same
      # toolchain without a separate corepack step.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn run build
      - name: Test
        run: yarn run test
