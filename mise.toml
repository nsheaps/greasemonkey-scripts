# Toolchain for this repo, used both locally and by CI (jdx/mise-action in
# .github/workflows/*). Only the tools this repo actually needs are pinned.
#
# Versions are pinned exactly rather than floating: "latest" causes
# cascade-breaks that show up as unrelated CI failures. Bump deliberately.
[tools]
# Must match .nvmrc and package.json's engines.node.
node = "24.20.0"
# Must match package.json's `packageManager` field so the lockfile metadata
# version is not migrated by a newer yarn. Renovate updates package.json but
# not this pin, so the two have to be changed in lockstep.
yarn = "4.18.0"
# Used by scripts/auto-bump-packages.sh to build its JSON summary. Preinstalled
# on GitHub's ubuntu runners, pinned here so local runs match.
jq = "1.8.2"

[settings]
# Use shorter paths for tools.
legacy_version_file = false
